<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Fire Plinko</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#03040d;color:#fff;font-family:system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;top:10px;left:50%;transform:translateX(-50%);text-align:center;z-index:5;pointer-events:none}
h1{margin:0;font-size:16px;letter-spacing:3px;text-shadow:0 0 15px #19dfff}
#status{font-size:11px;opacity:.75}
#score{position:fixed;right:14px;top:12px;z-index:5;color:#ffe278;font-weight:800}
#buttons{position:fixed;left:12px;top:12px;z-index:5}button{background:#101a39;color:#eaf8ff;border:1px solid #319bff;border-radius:7px;padding:7px 10px}
#board{position:fixed;left:0;right:0;bottom:0;height:105px;z-index:4;display:flex;gap:4px;padding:28px 7px 8px;background:linear-gradient(transparent,rgba(5,8,25,.97) 35%)}
.slot{flex:1;border:1px solid #2784c8;border-bottom:4px solid #55d9ff;border-radius:6px 6px 0 0;background:linear-gradient(#10264d,#071224);text-align:center;padding-top:6px;font-size:11px;box-shadow:0 0 12px #075c98 inset}
.slot strong{display:block;color:#ffe27c;font-size:17px;margin-top:3px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><h1>NEON FIRE PLINKO</h1><div id="status">동그란 구슬 · 충돌 발광 · 미니 폭발</div></div>
<div id="score">TOTAL: 0</div>
<div id="buttons"><button id="pause">일시정지</button><button id="reset">초기화</button></div>
<div id="board"></div>
<script>
const c=document.querySelector('#c'),ctx=c.getContext('2d'),board=document.querySelector('#board');
const scoreEl=document.querySelector('#score'),pauseBtn=document.querySelector('#pause');
let W,H,D=1,running=true,total=0,last=0,spawn=0;
const beads=[], sparks=[], pins=[], slots=Array.from({length:9},()=>0);
for(let i=0;i<9;i++){const e=document.createElement('div');e.className='slot';e.innerHTML=`${(i+1)*10}<strong>0</strong>`;board.appendChild(e)}
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);makePins()}
function makePins(){
 pins.length=0;
 const rows=9, top=105, bottom=H-135, gapY=(bottom-top)/(rows-1);
 for(let r=0;r<rows;r++){
  const n=r+1, gap=Math.min(68,W/(n+2)), cx=W/2, start=cx-(n-1)*gap/2;
  for(let j=0;j<n;j++)pins.push({x:start+j*gap,y:top+r*gapY,flash:0});
 }
}
function spawnBead(){
 const x=W/2+Math.sin(performance.now()*.0012)*Math.min(W*.25,170);
 beads.push({x,y:58,vx:(Math.random()-.5)*.7,vy:1.5+Math.random(),r:4+Math.random()*1.8,life:1});
}
function burst(x,y){
 for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:1+Math.random()*2})}
}
function update(dt){
 spawn+=dt;if(spawn>95){spawn=0;spawnBead()}
 for(const p of pins)p.flash*=Math.pow(.88,dt/16);
 for(let i=beads.length-1;i>=0;i--){
  const b=beads[i];b.vy+=.055*dt/16;b.x+=b.vx*dt/16;b.y+=b.vy*dt/16;
  let hit=false;
  for(const p of pins){
   const dx=b.x-p.x,dy=b.y-p.y,dist=Math.hypot(dx,dy),min=b.r+9;
   if(dist<min&&dy>0){
    const nx=dx/(dist||1),ny=dy/(dist||1);b.x=p.x+nx*min;b.y=p.y+ny*min;
    const dot=b.vx*nx+b.vy*ny;b.vx=(b.vx-2*dot*nx)*.82;b.vy=(b.vy-2*dot*ny)*.82;
    b.vx+=(Math.random()-.5)*.8;p.flash=1;burst(p.x,p.y);hit=true;break;
   }
  }
  if(b.y>H-112){
   const idx=Math.max(0,Math.min(8,Math.floor(b.x/W*9)));slots[idx]++;total+=(idx+1)*10;
   board.children[idx].querySelector('strong').textContent=slots[idx];scoreEl.textContent='TOTAL: '+total;
   beads.splice(i,1);continue;
  }
  if(b.x<3||b.x>W-3){b.vx*=-.8;b.x=Math.max(3,Math.min(W-3,b.x))}
 }
 for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx*dt/16;s.y+=s.vy*dt/16;s.vy+=.04*dt/16;s.life-=.045*dt/16;if(s.life<=0)sparks.splice(i,1)}
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#050719');bg.addColorStop(1,'#080d25');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 // pins as visible pointed graphics
 for(const p of pins){
  const glow=p.flash;
  ctx.save();ctx.translate(p.x,p.y);ctx.shadowBlur=glow?28:12;ctx.shadowColor=glow?'#fff36b':'#12bfff';
  ctx.fillStyle=glow?'#fff6a0':'#19bfff';ctx.strokeStyle=glow?'#fff':'#9ceeff';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(7,4);ctx.quadraticCurveTo(0,12,-7,4);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=glow?'#fff':'#0877c5';ctx.beginPath();ctx.arc(0,-3,3,0,Math.PI*2);ctx.fill();ctx.restore();
 }
 for(const b of beads){
  const g=ctx.createRadialGradient(b.x-1.5,b.y-1.5,1,b.x,b.y,b.r*3);g.addColorStop(0,'#fff');g.addColorStop(.25,'#b8f8ff');g.addColorStop(.65,'#18cfff');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.shadowBlur=18;ctx.shadowColor='#1bdcff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 }
 for(const s of sparks){ctx.globalAlpha=Math.max(0,s.life);ctx.fillStyle=s.life>.45?'#fff5a0':'#18cfff';ctx.shadowBlur=12;ctx.shadowColor='#ffe66d';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
}
function loop(t){const dt=Math.min(32,t-last||16);last=t;if(running)update(dt);draw();requestAnimationFrame(loop)}
addEventListener('resize',resize);pauseBtn.onclick=()=>{running=!running;pauseBtn.textContent=running?'일시정지':'계속'};document.querySelector('#reset').onclick=()=>location.reload();resize();requestAnimationFrame(loop);
</script>
</body></html>
