<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>빠칭코 게임</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .game-container {
      display: flex;
      gap: 20px;
      align-items: center;
      background: #2a2a2a;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
    }

    canvas {
      background: #0f0f1b;
      border-radius: 10px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 120px;
    }

    .score-board {
      font-size: 20px;
      font-weight: bold;
      color: #ffd700;
      text-align: center;
    }

    .lever-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle, #ff5555 0%, #aa0000 100%);
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 6px 0 #550000, 0 8px 10px rgba(0, 0, 0, 0.5);
      transition: all 0.1s ease;
      outline: none;
    }

    .lever-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #550000, 0 4px 5px rgba(0, 0, 0, 0.5);
    }

    .lever-visual {
      width: 12px;
      height: 100px;
      background: #666;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
    }

    .lever-knob {
      width: 24px;
      height: 24px;
      background: #ff3333;
      border-radius: 50%;
      position: absolute;
      top: 0;
      left: -6px;
      transition: top 0.1s ease;
    }
  </style>
</head>
<body>

  <h1>PACHINKO GAME</h1>

  <div class="game-container">
    <canvas id="pachinko" width="400" height="600"></canvas>

    <div class="controls">
      <div class="score-board">
        점수<br>
        <span id="score">0</span>
      </div>

      <div class="lever-visual">
        <div id="knob" class="lever-knob"></div>
      </div>

      <button id="launchBtn" class="lever-btn">발사!</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('pachinko');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const launchBtn = document.getElementById('launchBtn');
    const knob = document.getElementById('knob');

    let score = 0;
    const gravity = 0.2;
    const bounce = 0.6;

    // 공 객체 리스트
    let balls = [];

    // 핀(피라미드 배치) 설정
    const pins = [];
    const rows = 8;
    const startY = 120;
    const startX = 200;
    const spacing = 32;

    for (let r = 0; r < rows; r++) {
      const count = r + 3;
      const rowStartX = startX - ((count - 1) * spacing) / 2;
      for (let c = 0; c < count; c++) {
        pins.push({
          x: rowStartX + c * spacing,
          y: startY + r * spacing * 0.9,
          radius: 4
        });
      }
    }

    // 점수존 영역 설정 (하단 구분선 및 점수)
    const zones = [
      { xStart: 0, xEnd: 80, score: 10, color: '#4444ff' },
      { xStart: 80, xEnd: 160, score: 50, color: '#00cc66' },
      { xStart: 160, xEnd: 240, score: 100, color: '#ffcc00' },
      { xStart: 240, xEnd: 320, score: 50, color: '#00cc66' },
      { xStart: 320, xEnd: 400, score: 10, color: '#4444ff' }
    ];

    // 레버 발사 기능
    launchBtn.addEventListener('click', () => {
      // 레버 애니메이션 효과
      knob.style.top = '70px';
      setTimeout(() => knob.style.top = '0px', 150);

      // 공 생성 (오른쪽 발사관 하단 위치)
      const randomPower = 14 + Math.random() * 4; // 약간의 수직 발사 힘 변동
      balls.push({
        x: 385,
        y: 560,
        vx: 0,
        vy: -randomPower,
        radius: 7
      });
    });

    // 물리 엔진 및 업데이트
    function update() {
      for (let i = balls.length - 1; i >= 0; i--) {
        const ball = balls[i];

        ball.vy += gravity;
        ball.x += ball.vx;
        ball.y += ball.vy;

        // 상단 곡선 레일 우회 가이드 (발사관을 타고 메인 스테이지로 진입)
        if (ball.x > 370 && ball.y < 60) {
          ball.vx = -4 - Math.random() * 2;
          ball.vy = 1;
        }

        // 왼쪽/오른쪽 벽 충돌
        if (ball.x - ball.radius < 0) {
          ball.x = ball.radius;
          ball.vx *= -bounce;
        } else if (ball.x + ball.radius > (ball.y < 350 ? 370 : 400)) { // 오른쪽 발사관 벽 처리
          if (ball.y >= 60 && ball.x > 370) {
            ball.x = 370 - ball.radius;
            ball.vx *= -bounce;
          } else if (ball.x + ball.radius > 400) {
            ball.x = 400 - ball.radius;
            ball.vx *= -bounce;
          }
        }

        // 핀 충돌 처리
        pins.forEach(pin => {
          const dx = ball.x - pin.x;
          const dy = ball.y - pin.y;
          const dist = Math.hypot(dx, dy);
          const minDist = ball.radius + pin.radius;

          if (dist < minDist) {
            // 충돌 반사각 계산
            const angle = Math.atan2(dy, dx);
            const overlap = minDist - dist;

            ball.x += Math.cos(angle) * overlap;
            ball.y += Math.sin(angle) * overlap;

            // 속도 반사 및 랜덤성 추가
            const speed = Math.hypot(ball.vx, ball.vy) * bounce;
            ball.vx = Math.cos(angle) * speed + (Math.random() - 0.5) * 0.5;
            ball.vy = Math.sin(angle) * speed;
          }
        });

        // 하단 점수존 도달 판정
        if (ball.y + ball.radius >= 550) {
          zones.forEach(zone => {
            if (ball.x >= zone.xStart && ball.x < zone.xEnd) {
              score += zone.score;
              scoreEl.textContent = score;
            }
          });
          // 공 제거
          balls.splice(i, 1);
        }
      }
    }

    // 화면 그리기
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 발사관 가이드라인 그리기
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(370, 600);
      ctx.lineTo(370, 70);
      ctx.arc(330, 70, 40, 0, -Math.PI / 2, true);
      ctx.stroke();

      // 점수존 영역 그리기
      zones.forEach(zone => {
        ctx.fillStyle = zone.color;
        ctx.fillRect(zone.xStart, 550, zone.xEnd - zone.xStart, 50);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(`+${zone.score}`, zone.xStart + (zone.xEnd - zone.xStart) / 2, 580);

        // 구분선
        ctx.strokeStyle = '#222';
        ctx.beginPath();
        ctx.moveTo(zone.xEnd, 520);
        ctx.lineTo(zone.xEnd, 600);
        ctx.stroke();
      });

      // 핀 그리기
      pins.forEach(pin => {
        ctx.beginPath();
        ctx.arc(pin.x, pin.y, pin.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#e6c619';
        ctx.fill();
        ctx.closePath();
      });

      // 공 그리기
      balls.forEach(ball => {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 5;
        ctx.shadowColor = '#ffffff';
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.closePath();
      });
    }

    // 메인 루프
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
