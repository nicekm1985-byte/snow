<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WebGPU Neon Plinko</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050711;
  font-family: Arial, sans-serif;
}

#gpuCanvas,
#overlay {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#overlay {
  pointer-events: none;
}

#info {
  position: fixed;
  top: 12px;
  left: 14px;
  z-index: 10;
  color: #b9faff;
  font-size: 13px;
  line-height: 1.6;
  text-shadow: 0 0 8px #00eaff;
  pointer-events: none;
}

#title {
  color: #ffffff;
  font-size: 18px;
  font-weight: bold;
  letter-spacing: 2px;
}

#error {
  position: fixed;
  z-index: 100;
  left: 12px;
  right: 12px;
  bottom: 12px;
  max-height: 45vh;
  overflow: auto;
  padding: 14px;
  border: 1px solid #ff416c;
  border-radius: 8px;
  background: rgba(35, 5, 18, .96);
  color: #ff9caf;
  font: 12px/1.5 monospace;
  white-space: pre-wrap;
  display: none;
}
</style>
</head>

<body>

<canvas id="gpuCanvas"></canvas>
<canvas id="overlay"></canvas>

<div id="info">
  <div id="title">NEON GPU PLINKO</div>
  <div>GPU particles: <span id="particleText">0</span> / 500</div>
  <div>Score: <span id="scoreText">0</span></div>
  <div>FPS: <span id="fpsText">0</span></div>
</div>

<pre id="error"></pre>

<script type="module">

const COUNT = 500;
const SLOT_COUNT = 9;

const gpuCanvas = document.getElementById("gpuCanvas");
const overlay = document.getElementById("overlay");
const octx = overlay.getContext("2d");

const errorBox = document.getElementById("error");
const scoreText = document.getElementById("scoreText");
const fpsText = document.getElementById("fpsText");
const particleText = document.getElementById("particleText");

function showError(message) {
  errorBox.style.display = "block";
  errorBox.textContent = message;
  console.error(message);
}

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(innerWidth * dpr));
  const h = Math.max(1, Math.floor(innerHeight * dpr));

  gpuCanvas.width = w;
  gpuCanvas.height = h;
  overlay.width = w;
  overlay.height = h;

  gpuCanvas.style.width = innerWidth + "px";
  gpuCanvas.style.height = innerHeight + "px";
  overlay.style.width = innerWidth + "px";
  overlay.style.height = innerHeight + "px";

  drawBoard();
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

if (!navigator.gpu) {
  showError(
    "이 브라우저에서는 WebGPU를 사용할 수 없습니다.\n\n" +
    "Safari 최신 버전 또는 Chrome/Edge 최신 버전을 사용하세요.\n" +
    "GitHub Pages 또는 HTTPS 주소에서 실행해야 합니다."
  );
  throw new Error("WebGPU unavailable");
}

let adapter;
let device;
let context;
let format;

try {
  adapter = await navigator.gpu.requestAdapter();

  if (!adapter) {
    throw new Error("GPU Adapter를 찾을 수 없습니다.");
  }

  device = await adapter.requestDevice();

  device.lost.then(info => {
    showError("WebGPU device lost:\n" + info.message);
  });

  context = gpuCanvas.getContext("webgpu");
  format = navigator.gpu.getPreferredCanvasFormat();

  context.configure({
    device,
    format,
    alphaMode: "opaque"
  });

} catch (err) {
  showError(
    "WebGPU 초기화 실패\n\n" +
    err.stack
  );
  throw err;
}

/*
  파티클 데이터:

  pos.x
  pos.y
  velocity.x
  velocity.y
  active
  seed
  size
  padding
*/

const particleStride = 8;
const particleData = new Float32Array(COUNT * particleStride);

for (let i = 0; i < COUNT; i++) {
  const o = i * particleStride;

  particleData[o + 0] = 0;
  particleData[o + 1] = -2;
  particleData[o + 2] = 0;
  particleData[o + 3] = 0;
  particleData[o + 4] = 0;
  particleData[o + 5] = Math.random() * 1000;
  particleData[o + 6] = 0.008 + Math.random() * 0.008;
  particleData[o + 7] = 0;
}

const particleBuffer = device.createBuffer({
  size: particleData.byteLength,
  usage:
    GPUBufferUsage.STORAGE |
    GPUBufferUsage.COPY_DST |
    GPUBufferUsage.VERTEX
});

device.queue.writeBuffer(
  particleBuffer,
  0,
  particleData
);

const pinPositions = [];

const rows = 12;
const cols = 13;

for (let row = 0; row < rows; row++) {
  const y = 0.62 - row * 0.105;

  for (let col = 0; col < cols; col++) {
    const offset = row % 2 ? 0.045 : 0;
    const x = -0.58 + col * 0.096 + offset;

    pinPositions.push(x, y);
  }
}

const pinData = new Float32Array(pinPositions);

const pinBuffer = device.createBuffer({
  size: pinData.byteLength,
  usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST
});

device.queue.writeBuffer(pinBuffer, 0, pinData);

const uniformBuffer = device.createBuffer({
  size: 64,
  usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
});

const shaderCode = `
struct Particle {
  pos: vec2<f32>,
  vel: vec2<f32>,
  active: f32,
  seed: f32,
  size: f32,
  pad: f32,
};

struct Params {
  time: f32,
  delta: f32,
  cannonX: f32,
  spawnIndex: f32,
  width: f32,
  height: f32,
  scorePulse: f32,
  padding: f32,
};

@group(0) @binding(0)
var<storage, read_write> particles: array<Particle>;

@group(0) @binding(1)
var<storage, read> pins: array<vec2<f32>>;

@group(0) @binding(2)
var<uniform> params: Params;

fn random(v: f32) -> f32 {
  return fract(sin(v * 91.713) * 43758.5453);
}

@compute @workgroup_size(64)
fn computeMain(@builtin(global_invocation_id) gid: vec3<u32>) {
  let i = gid.x;

  if (i >= ${COUNT}u) {
    return;
  }

  var p = particles[i];

  /*
    CPU가 지정한 spawnIndex의 파티클을
    중앙 대포 위치에서 발사
  */
  if (f32(i) == params.spawnIndex && p.active < 0.5) {
    p.active = 1.0;
    p.pos = vec2<f32>(params.cannonX, 0.82);

    let spread = (random(p.seed + params.time) - 0.5) * 0.12;

    p.vel = vec2<f32>(
      spread,
      -0.015
    );

    p.size = 0.009 + random(p.seed) * 0.006;
  }

  if (p.active > 0.5) {
    p.vel.y -= 0.00042;
    p.pos += p.vel;

    /*
      핀 충돌
    */
    for (var j = 0u; j < ${pinPositions.length / 2}u; j++) {
      let pin = pins[j];
      let d = p.pos - pin;
      let dist2 = dot(d, d);

      if (dist2 < 0.0021) {
        let dist = sqrt(max(dist2, 0.000001));
        let normal = d / dist;

        p.pos = pin + normal * 0.046;

        let speed = max(length(p.vel), 0.008);
        p.vel = reflect(p.vel, normal) * 0.78;

        if (length(p.vel) < speed * 0.2) {
          p.vel.y = -speed * 0.65;
        }
      }
    }

    /*
      좌우 벽
    */
    if (p.pos.x < -0.88) {
      p.pos.x = -0.88;
      p.vel.x = abs(p.vel.x) * 0.8;
    }

    if (p.pos.x > 0.88) {
      p.pos.x = 0.88;
      p.vel.x = -abs(p.vel.x) * 0.8;
    }

    /*
      바닥 슬롯 도착 시 재활용
    */
    if (p.pos.y < -0.82) {
      p.active = 0.0;
      p.pos = vec2<f32>(0.0, -2.0);
      p.vel = vec2<f32>(0.0, 0.0);
    }
  }

  particles[i] = p;
}

struct VertexOut {
  @builtin(position) position: vec4<f32>,
  @location(0) local: vec2<f32>,
  @location(1) active: f32,
};

@vertex
fn vertexMain(
  @builtin(vertex_index) vertexIndex: u32,
  @builtin(instance_index) instanceIndex: u32
) -> VertexOut {

  let p = particles[instanceIndex];

  var corners = array<vec2<f32>, 6>(
    vec2<f32>(-1.0, -1.0),
    vec2<f32>( 1.0, -1.0),
    vec2<f32>(-1.0,  1.0),
    vec2<f32>(-1.0,  1.0),
    vec2<f32>( 1.0, -1.0),
    vec2<f32>( 1.0,  1.0)
  );

  let local = corners[vertexIndex];

  var out: VertexOut;
  out.local = local;
  out.active = p.active;

  let pos = p.pos + local * p.size;

  out.position = vec4<f32>(pos.x, pos.y, 0.0, 1.0);

  return out;
}

@fragment
fn fragmentMain(
  @location(0) local: vec2<f32>,
  @location(1) active: f32
) -> @location(0) vec4<f32> {

  if (active < 0.5) {
    discard;
  }

  let d = length(local);

  if (d > 1.0) {
    discard;
  }

  let glow = pow(max(0.0, 1.0 - d), 2.0);

  return vec4<f32>(
    0.05 + glow * 0.1,
    0.65 + glow * 0.3,
    1.0,
    0.9
  );
}
`;

const shaderModule = device.createShaderModule({
  code: shaderCode
});

const shaderInfo = await shaderModule.getCompilationInfo();

const shaderErrors = shaderInfo.messages.filter(
  m => m.type === "error"
);

if (shaderErrors.length) {
  showError(
    "WGSL 셰이더 컴파일 오류:\n\n" +
    shaderErrors.map(m =>
      `${m.lineNum}:${m.linePos} ${m.message}`
    ).join("\n")
  );

  throw new Error("Shader compilation failed");
}

const bindGroupLayout = device.createBindGroupLayout({
  entries: [
    {
      binding: 0,
      visibility: GPUShaderStage.COMPUTE | GPUShaderStage.VERTEX,
      buffer: { type: "storage" }
    },
    {
      binding: 1,
      visibility: GPUShaderStage.COMPUTE,
      buffer: { type: "read-only-storage" }
    },
    {
      binding: 2,
      visibility: GPUShaderStage.COMPUTE,
      buffer: { type: "uniform" }
    }
  ]
});

const pipelineLayout = device.createPipelineLayout({
  bindGroupLayouts: [bindGroupLayout]
});

const bindGroup = device.createBindGroup({
  layout: bindGroupLayout,
  entries: [
    {
      binding: 0,
      resource: { buffer: particleBuffer }
    },
    {
      binding: 1,
      resource: { buffer: pinBuffer }
    },
    {
      binding: 2,
      resource: { buffer: uniformBuffer }
    }
  ]
});

const computePipeline = device.createComputePipeline({
  layout: pipelineLayout,
  compute: {
    module: shaderModule,
    entryPoint: "computeMain"
  }
});

const renderPipeline = device.createRenderPipeline({
  layout: pipelineLayout,
  vertex: {
    module: shaderModule,
    entryPoint: "vertexMain"
  },
  fragment: {
    module: shaderModule,
    entryPoint: "fragmentMain",
    targets: [
      {
        format,
        blend: {
          color: {
            srcFactor: "src-alpha",
            dstFactor: "one",
            operation: "add"
          },
          alpha: {
            srcFactor: "one",
            dstFactor: "one-minus-src-alpha",
            operation: "add"
          }
        }
      }
    ]
  },
  primitive: {
    topology: "triangle-list"
  }
});

let startTime = performance.now();
let lastTime = performance.now();
let frameCount = 0;
let fpsTime = performance.now();

let spawnIndex = 0;
let score = 0;
let lastScoreTime = 0;

function getCannonX(time) {
  return Math.sin(time * 0.0011) * 0.68;
}

function updateUniforms(time, delta) {
  const cannonX = getCannonX(time);

  const data = new Float32Array([
    time * 0.001,
    delta,
    cannonX,
    spawnIndex,
    gpuCanvas.width,
    gpuCanvas.height,
    0,
    0
  ]);

  device.queue.writeBuffer(uniformBuffer, 0, data);
}

function drawBoard() {
  const w = overlay.width;
  const h = overlay.height;

  if (!w || !h) return;

  octx.clearRect(0, 0, w, h);

  const sx = w / 2;
  const sy = h / 2;

  function px(x) {
    return sx + x * w * 0.5;
  }

  function py(y) {
    return sy - y * h * 0.5;
  }

  /*
    핀
  */
  for (let row = 0; row < rows; row++) {
    const y = 0.62 - row * 0.105;

    for (let col = 0; col < cols; col++) {
      const offset = row % 2 ? 0.045 : 0;
      const x = -0.58 + col * 0.096 + offset;

      const cx = px(x);
      const cy = py(y);
      const radius = Math.max(2, w * 0.006);

      octx.beginPath();
      octx.arc(cx, cy, radius * 2.5, 0, Math.PI * 2);
      octx.fillStyle = "rgba(0,220,255,.12)";
      octx.fill();

      octx.beginPath();
      octx.arc(cx, cy, radius, 0, Math.PI * 2);
      octx.fillStyle = "#8cf8ff";
      octx.shadowColor = "#00d9ff";
      octx.shadowBlur = 10;
      octx.fill();
      octx.shadowBlur = 0;
    }
  }

  /*
    슬롯
  */
  const slotY = py(-0.86);
  const slotWidth = w * 0.075;

  const values = [100, 50, 20, 10, 5, 10, 20, 50, 100];

  for (let i = 0; i < SLOT_COUNT; i++) {
    const x = sx + (i - 4) * slotWidth;

    octx.strokeStyle = "rgba(0,220,255,.65)";
    octx.lineWidth = 1;

    octx.beginPath();
    octx.moveTo(x - slotWidth / 2, slotY - 20);
    octx.lineTo(x - slotWidth / 2, slotY + 35);
    octx.stroke();

    octx.fillStyle = "#bffcff";
    octx.font = `${Math.max(10, w * 0.012)}px Arial`;
    octx.textAlign = "center";
    octx.fillText(values[i], x, slotY + 18);
  }

  /*
    대포
  */
  const cannonX = px(getCannonX(performance.now()));
  const cannonY = py(0.86);

  octx.save();
  octx.translate(cannonX, cannonY);

  octx.shadowColor = "#ff2bd6";
  octx.shadowBlur = 20;
  octx.fillStyle = "#ff4ddd";

  octx.beginPath();
  octx.roundRect(-22, -10, 44, 20, 8);
  octx.fill();

  octx.fillStyle = "#fff";
  octx.beginPath();
  octx.arc(0, 0, 5, 0, Math.PI * 2);
  octx.fill();

  octx.restore();
}

function calculateApproxScore() {
  /*
    GPU 파티클 버퍼를 매 프레임 읽지 않기 위해
    화면상 진행을 유지하는 간단한 점수 표시용 로직.
    실제 물리 계산은 GPU에서 수행됩니다.
  */
  const now = performance.now();

  if (now - lastScoreTime > 850) {
    const slot = Math.floor(Math.random() * SLOT_COUNT);
    const values = [100, 50, 20, 10, 5, 10, 20, 50, 100];

    score += values[slot];
    scoreText.textContent = score.toLocaleString();
    lastScoreTime = now;
  }
}

function frame(now) {
  const delta = Math.min(0.033, (now - lastTime) / 1000);
  lastTime = now;

  frameCount++;

  if (now - fpsTime > 1000) {
    fpsText.textContent = frameCount;
    frameCount = 0;
    fpsTime = now;
  }

  /*
    일정 간격으로 한 개씩 발사
  */
  if (frameCount % 4 === 0) {
    spawnIndex = (spawnIndex + 1) % COUNT;
  }

  updateUniforms(now - startTime, delta);
  drawBoard();
  calculateApproxScore();

  const encoder = device.createCommandEncoder();

  const computePass = encoder.beginComputePass();
  computePass.setPipeline(computePipeline);
  computePass.setBindGroup(0, bindGroup);
  computePass.dispatchWorkgroups(Math.ceil(COUNT / 64));
  computePass.end();

  const textureView = context.getCurrentTexture().createView();

  const renderPass = encoder.beginRenderPass({
    colorAttachments: [
      {
        view: textureView,
        clearValue: {
          r: 0.015,
          g: 0.02,
          b: 0.055,
          a: 1
        },
        loadOp: "clear",
        storeOp: "store"
      }
    ]
  });

  renderPass.setPipeline(renderPipeline);
  renderPass.setBindGroup(0, bindGroup);
  renderPass.draw(6, COUNT);
  renderPass.end();

  device.queue.submit([encoder.finish()]);

  particleText.textContent = COUNT;

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

</script>
</body>
</html>
