<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WebGPU Neon Plinko</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#050611;color:#eaf6ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
  #wrap{position:fixed;inset:0}
  canvas{width:100%;height:100%;display:block}
  #ui{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:3;text-align:center;pointer-events:none}
  #ui h1{margin:0;font-size:18px;letter-spacing:3px;text-shadow:0 0 12px #35d9ff}
  #status{font-size:12px;opacity:.8;margin-top:4px}
  #score{position:fixed;right:14px;top:14px;z-index:3;font-weight:700;color:#ffe98a;text-shadow:0 0 10px #ffb300}
  #buttons{position:fixed;left:14px;top:14px;z-index:3;display:flex;gap:7px}
  button{border:1px solid #3e9dff;background:#101c3c;color:#dff5ff;border-radius:8px;padding:7px 10px;cursor:pointer}
  #fallback{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:#050611;z-index:10}
  #fallback div{max-width:520px;line-height:1.6}
</style>
</head>
<body>
<div id="wrap"><canvas id="gpu"></canvas></div>
<div id="ui"><h1>NEON PLINKO · WEBGPU</h1><div id="status">초기화 중…</div></div>
<div id="score">SCORE: 0</div>
<div id="buttons"><button id="pause">일시정지</button><button id="restart">재시작</button></div>
<div id="fallback"><div><h2>WebGPU를 사용할 수 없습니다</h2><p>최신 Safari/Chrome/Edge에서 HTTPS 환경으로 열어주세요.<br>iPhone/iPad는 최신 iOS/iPadOS와 Safari가 필요합니다.</p></div></div>

<script type="module">
const canvas=document.querySelector('#gpu');
const statusEl=document.querySelector('#status');
const scoreEl=document.querySelector('#score');
const fallback=document.querySelector('#fallback');
const pauseBtn=document.querySelector('#pause');
const restartBtn=document.querySelector('#restart');

let device,context,format,simPipeline,renderPipeline,bindGroup,particleBuffer,pinBuffer,uniformBuffer;
let running=true, score=0, last=performance.now(), spawnAcc=0;
const PARTICLES=500;
const MAX_PINS=80;

function msg(t){statusEl.textContent=t}

function makePins(){
  const pins=[];
  const rows=10;
  for(let r=0;r<rows;r++){
    const count=r+1;
    const gapX=0.145;
    const y=0.72-r*0.135;
    const start=-(count-1)*gapX/2;
    for(let c=0;c<count;c++){
      pins.push([start+c*gapX,y]);
    }
  }
  while(pins.length<MAX_PINS)pins.push([9,9]);
  return new Float32Array(pins.flat());
}

const simWGSL=`
struct Particle { pos: vec2<f32>, vel: vec2<f32>, alive: f32, pad: f32 };
struct Sim { dt:f32, time:f32, count:f32, pad:f32 };
@group(0) @binding(0) var<storage, read_write> particles: array<Particle>;
@group(0) @binding(1) var<storage, read> pins: array<vec2<f32>>;
@group(0) @binding(2) var<uniform> sim: Sim;

fn hash(x:u32)->f32{
  var n=x*747796405u+2891336453u;
  n=((n>>((n>>28u)+4u))^n)*277803737u;
  n=(n>>22u)^n;
  return f32(n)/4294967295.0;
}

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) id:vec3<u32>){
  let i=id.x;
  if(i>=${PARTICLES}u){return;}
  var p=particles[i];

  if(p.alive<0.5){
    let phase=sim.time*0.001 + f32(i)*0.071;
    if(fract(phase*0.33)<0.018){
      p.pos=vec2<f32>(sin(sim.time*0.0012)*0.68,0.94);
      p.vel=vec2<f32>((hash(i+u32(sim.time))-.5)*0.035,-0.03);
      p.alive=1.0;
    }
  }else{
    let dt=sim.dt;
    p.vel.y-=0.00042*dt;
    p.pos+=p.vel*dt;

    for(var k:u32=0u;k<${MAX_PINS}u;k++){
      let pin=pins[k];
      if(pin.x>2.0){continue;}
      let d=p.pos-pin;
      let dist=length(d);
      if(dist<0.035){
        let n=normalize(d+vec2<f32>(0.0001,0.0002));
        p.pos=pin+n*0.037;
        p.vel=reflect(p.vel,n)*0.78;
        p.vel.x += (hash(i+k+u32(sim.time))-.5)*0.008;
      }
    }

    if(p.pos.y<-0.93){
      p.alive=0.0;
    }
    if(abs(p.pos.x)>1.05 || p.pos.y>1.08){
      p.alive=0.0;
    }
  }
  particles[i]=p;
}
`;

const renderWGSL=`
struct Particle { pos: vec2<f32>, vel: vec2<f32>, alive:f32, pad:f32 };
@group(0) @binding(0) var<storage, read> particles: array<Particle>;

struct VOut { @builtin(position) pos:vec4<f32>, @location(0) alive:f32 };

@vertex
fn vs(@builtin(vertex_index) vi:u32,@builtin(instance_index) ii:u32)->VOut{
  var corners=array<vec2<f32>,6>(
    vec2<f32>(-0.012,-0.012),vec2<f32>(0.012,-0.012),vec2<f32>(0.012,0.012),
    vec2<f32>(-0.012,-0.012),vec2<f32>(0.012,0.012),vec2<f32>(-0.012,0.012)
  );
  let p=particles[ii];
  var o:VOut;
  o.pos=vec4<f32>(p.pos+corners[vi],0,1);
  o.alive=p.alive;
  return o;
}
@fragment
fn fs(i:VOut)->@location(0) vec4<f32>{
  if(i.alive<0.5){discard;}
  return vec4<f32>(0.1,0.85,1.0,1.0);
}
`;

async function init(){
  if(!navigator.gpu){fallback.style.display='grid';return;}
  const adapter=await navigator.gpu.requestAdapter();
  if(!adapter){fallback.style.display='grid';return;}
  device=await adapter.requestDevice();
  context=canvas.getContext('webgpu');
  format=navigator.gpu.getPreferredCanvasFormat();
  resize();
  context.configure({device,format,alphaMode:'opaque'});

  const initial=new Float32Array(PARTICLES*6);
  for(let i=0;i<PARTICLES;i++) initial[i*6+4]=0;

  particleBuffer=device.createBuffer({
    size:initial.byteLength,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST
  });
  device.queue.writeBuffer(particleBuffer,0,initial);

  pinBuffer=device.createBuffer({
    size:MAX_PINS*2*4,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST
  });
  device.queue.writeBuffer(pinBuffer,0,makePins());

  uniformBuffer=device.createBuffer({
    size:16,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST
  });

  simPipeline=device.createComputePipeline({
    layout:'auto',
    compute:{module:device.createShaderModule({code:simWGSL}),entryPoint:'main'}
  });
  renderPipeline=device.createRenderPipeline({
    layout:'auto',
    vertex:{module:device.createShaderModule({code:renderWGSL}),entryPoint:'vs'},
    fragment:{module:device.createShaderModule({code:renderWGSL}),entryPoint:'fs',targets:[{format}]},
    primitive:{topology:'triangle-list'}
  });

  const simBG=device.createBindGroup({
    layout:simPipeline.getBindGroupLayout(0),
    entries:[
      {binding:0,resource:{buffer:particleBuffer}},
      {binding:1,resource:{buffer:pinBuffer}},
      {binding:2,resource:{buffer:uniformBuffer}}
    ]
  });
  const renderBG=device.createBindGroup({
    layout:renderPipeline.getBindGroupLayout(0),
    entries:[{binding:0,resource:{buffer:particleBuffer}}]
  });
  bindGroup={simBG,renderBG};
  msg('실제 WebGPU Compute + Instanced Render 실행 중');
  requestAnimationFrame(frame);
}

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.max(1,Math.floor(innerWidth*dpr));
  canvas.height=Math.max(1,Math.floor(innerHeight*dpr));
}
addEventListener('resize',()=>{if(device){resize();context.configure({device,format,alphaMode:'opaque'})}});

function frame(now){
  const dt=Math.min((now-last)/16.67,2.0); last=now;
  if(running){
    spawnAcc+=dt;
    const u=new Float32Array([dt,now,0,0]);
    device.queue.writeBuffer(uniformBuffer,0,u);
    const enc=device.createCommandEncoder();
    const cp=enc.beginComputePass();
    cp.setPipeline(simPipeline);cp.setBindGroup(0,bindGroup.simBG);cp.dispatchWorkgroups(Math.ceil(PARTICLES/64));cp.end();
    const rp=enc.beginRenderPass({
      colorAttachments:[{view:context.getCurrentTexture().createView(),clearValue:{r:0.015,g:0.02,b:0.07,a:1},loadOp:'clear',storeOp:'store'}]
    });
    rp.setPipeline(renderPipeline);rp.setBindGroup(0,bindGroup.renderBG);rp.draw(6,PARTICLES);rp.end();
    device.queue.submit([enc.finish()]);
  }
  requestAnimationFrame(frame);
}

pauseBtn.onclick=()=>{running=!running;pauseBtn.textContent=running?'일시정지':'계속'};
restartBtn.onclick=()=>location.reload();

init().catch(e=>{console.error(e);fallback.style.display='grid';});
</script>
</body>
</html>
